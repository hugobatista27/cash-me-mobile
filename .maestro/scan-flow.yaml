appId: host.exp.exponent
---
# ==============================================================================
# Suíte de Testes E2E Maestro - TASK-03: Leitura de QR Code e Entrada Manual NFC-e
# 1. Autenticação Real do Consumidor
# 2. Navegação para a Aba Escanear (Viewfinder & Controles)
# 3. Teste de Abertura do Portal SEFAZ SC via WebView Modal
# 4. Navegação para Entrada Manual da Chave de 44 Dígitos (scan-manual.tsx)
# 5. Validação de Estado Não Homologado - RN07 (Ex: SP código 35)
# 6. Handoff seguro para SEFAZ com chave SC válida (sem bypass de CAPTCHA)
# 7. Logout para Higienização do Estado
# ==============================================================================

# 0. Normaliza estado inicial
- runFlow:
    when:
      visible: "Fast Refresh"
    commands:
      - back

- runFlow:
    when:
      visible: "Chave da NFC-e"
    commands:
      - tapOn: "Voltar"

- runFlow:
    when:
      visible: "← Voltar para login"
    commands:
      - tapOn: "← Voltar para login"

- runFlow:
    when:
      visible: "Painel do Estabelecimento"
    commands:
      - tapOn: "Perfil Loja"
      - extendedWaitUntil:
          visible: "Encerrar Sessão"
          timeout: 10000
      - tapOn: "Encerrar Sessão"
      - extendedWaitUntil:
          visible: "Sair"
          timeout: 5000
      - tapOn: "Sair"

# ------------------------------------------------------------------------------
# PARTE 1: LOGIN DO CONSUMIDOR (CASO ESTEJA NA TELA DE LOGIN)
# ------------------------------------------------------------------------------
- runFlow:
    when:
      visible: "Bem-vindo ao CashMe"
    commands:
      - tapOn: "Criar conta Consumidor"
      - extendedWaitUntil:
          visible: "← Voltar para login"
          timeout: 5000
      - tapOn: "← Voltar para login"
      - extendedWaitUntil:
          visible: "Bem-vindo ao CashMe"
          timeout: 5000

      - tapOn: "seu.email@exemplo.com"
      - inputText: "cliente.live3@cashme.com"
      - hideKeyboard

      - tapOn: "Sua senha secreta"
      - inputText: "password123"
      - hideKeyboard

      - tapOn: "Entrar"

      - extendedWaitUntil:
          visible: "Área do Consumidor"
          timeout: 15000

# ------------------------------------------------------------------------------
# PARTE 2: NAVEGAÇÃO PARA A TELA DE ESCANEAMENTO
# ------------------------------------------------------------------------------
- tapOn: "Escanear"

- runFlow:
    when:
      visible: "Permitir Acesso à Câmera"
    commands:
      - tapOn: "Permitir Acesso à Câmera"

- runFlow:
    when:
      visible: "ALLOW"
    commands:
      - tapOn: "ALLOW"

- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"

- extendedWaitUntil:
    visible: "Digitar Chave.*"
    timeout: 10000

- assertVisible: "SEFAZ SC"
- assertVisible: "SEFAZ PR"

# Verifica botão de lanterna (em Expo Go o ícone flutuante do dev-menu pode sobrepor o toque)
- assertVisible: "Alternar Lanterna"

# ------------------------------------------------------------------------------
# PARTE 3: MODAL DO PORTAL SEFAZ SC VIA WEBVIEW
# ------------------------------------------------------------------------------
- tapOn: "SEFAZ SC"

- extendedWaitUntil:
    visible: "Portal SEFAZ"
    timeout: 10000

- tapOn: "Voltar"

- extendedWaitUntil:
    visible: "Digitar Chave.*"
    timeout: 10000

# ------------------------------------------------------------------------------
# PARTE 4: ENTRADA MANUAL DA CHAVE DE ACESSO
# ------------------------------------------------------------------------------
- tapOn: "Digitar Chave.*"

- extendedWaitUntil:
    visible: "Entrada Manual"
    timeout: 10000

- assertVisible: "Chave da NFC-e"
- assertVisible: "Localize os 44 dígitos"
- assertVisible: "Consultar na SEFAZ e Pontuar"
- assertVisible: "Portal SEFAZ SC"
- assertVisible: "Portal SEFAZ PR"

# ------------------------------------------------------------------------------
# PARTE 5: VALIDAÇÃO LOCAL DE ESTADO NÃO HOMOLOGADO (RN07)
# ------------------------------------------------------------------------------
- tapOn:
    below: "Chave de Acesso (44 Dígitos)"
- inputText: "35261050401244000154650010000000011123456789"
- hideKeyboard

- assertVisible: "44/44"
- tapOn: "Consultar na SEFAZ e Pontuar"

- extendedWaitUntil:
    visible: "Chave Não Homologada (RN07)"
    timeout: 5000

- assertVisible: "Estado não homologado. O Cash Me aceita apenas SC e PR nesta versão piloto (RN07)."
- tapOn: "OK"

# ------------------------------------------------------------------------------
# PARTE 6: HANDOFF SEGURO PARA SEFAZ COM CHAVE SC VÁLIDA
# ------------------------------------------------------------------------------
- tapOn: "Voltar"
- runFlow:
    when:
      visible: "Área do Consumidor"
    commands:
      - tapOn: "Escanear"
- extendedWaitUntil:
    visible: "Digitar Chave.*"
    timeout: 10000
- tapOn: "Digitar Chave.*"
- extendedWaitUntil:
    visible: "Entrada Manual"
    timeout: 10000

- tapOn:
    below: "Chave de Acesso (44 Dígitos)"
- inputText: "42261050401244000154650010000000011123456789"
- hideKeyboard

- assertVisible: "44/44"
- tapOn: "Consultar na SEFAZ e Pontuar"

- extendedWaitUntil:
    visible: "Chave Copiada"
    timeout: 5000
- tapOn: "Abrir Portal SEFAZ"

- extendedWaitUntil:
    visible: "Portal SEFAZ"
    timeout: 10000

- tapOn: "Voltar"
- extendedWaitUntil:
    visible: "Entrada Manual"
    timeout: 10000

- tapOn: "Voltar"

# Volta para a Home e realiza Logout
- runFlow:
    when:
      visible: "Fechar"
    commands:
      - tapOn: "Fechar"

- extendedWaitUntil:
    visible: "Área do Consumidor"
    timeout: 10000

- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Encerrar Sessão"
    timeout: 10000
- tapOn: "Encerrar Sessão"
- extendedWaitUntil:
    visible: "Sair"
    timeout: 5000
- tapOn: "Sair"
- extendedWaitUntil:
    visible: "Bem-vindo ao CashMe"
    timeout: 10000
