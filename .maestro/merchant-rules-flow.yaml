appId: host.exp.exponent
---
# ==============================================================================
# Suíte de Testes E2E Maestro - TASK-06: Interface do Lojista (Regras & Simulador)
# 1. Autenticação Real do Lojista (ou reaproveitamento de sessão ativa)
# 2. Validação da Regra Ativa Vigente (Card com resumo humano)
# 3. Simulação em Tempo Real com Debounce
# 4. Navegação e Auditoria de Histórico de Regras (RN04)
# 5. Publicação e Versionamento de Nova Regra (v2)
# 6. Invalidação de Cache e Atualização Instantânea da UI
# 7. Logout para Higienização do Estado
# ==============================================================================

# Se estiver na tela de histórico de regras de execução anterior, volta para tabs
- runFlow:
    when:
      visible: "Histórico de Regras"
    commands:
      - tapOn: "Voltar"

# Se estiver na tela de consumidor logado por engano, desloga primeiro
- runFlow:
    when:
      visible: "Área do Consumidor"
    commands:
      - tapOn: "Perfil"
      - extendedWaitUntil:
          visible: "Encerrar Sessão"
          timeout: 10000
      - tapOn: "Encerrar Sessão"
      - extendedWaitUntil:
          visible: "Sair"
          timeout: 5000
      - tapOn: "Sair"

# ------------------------------------------------------------------------------
# PARTE 1: LOGIN DO LOJISTA (CASO ESTEJA NA TELA DE LOGIN)
# ------------------------------------------------------------------------------
- runFlow:
    when:
      visible: "Bem-vindo ao CashMe"
    commands:
      - tapOn: "seu.email@exemplo.com"
      - eraseText: 50
      - inputText: "lojista.live3@cashme.com"
      - hideKeyboard

      - tapOn: "Sua senha secreta"
      - eraseText: 50
      - inputText: "password123"
      - hideKeyboard

      - tapOn: "Entrar"

      - extendedWaitUntil:
          visible: "Painel do Estabelecimento"
          timeout: 15000

# ------------------------------------------------------------------------------
# PARTE 2: NAVEGAÇÃO PARA A TELA DE REGRAS E VALIDAÇÃO DA REGRA ATIVA
# ------------------------------------------------------------------------------
- tapOn: "Regras"

- extendedWaitUntil:
    visible: "Regras e Simulador"
    timeout: 10000

- assertVisible: "POLÍTICAS DE FIDELIDADE"
- assertVisible: "Regra Ativa Oficial"
- assertVisible: "v1"

# ------------------------------------------------------------------------------
# PARTE 3: SIMULADOR EM TEMPO REAL
# ------------------------------------------------------------------------------
- tapOn:
    below: "Valor da Compra (R$)"
- eraseText: 20
- inputText: "250.00"
- hideKeyboard

- extendedWaitUntil:
    visible: "250 pts"
    timeout: 5000

# ------------------------------------------------------------------------------
# PARTE 4: AUDITORIA DO HISTÓRICO DE REGRAS
# ------------------------------------------------------------------------------
- tapOn: "Histórico"
- extendedWaitUntil:
    visible: "Histórico de Regras"
    timeout: 5000

- assertVisible: "Auditoria e versionamento imutável (RN04)"
- assertVisible: "Versão 1"
- assertVisible: "Ativa"

# Retorna para a tela de Regras tocando no botão Voltar
- tapOn: "Voltar"

- extendedWaitUntil:
    visible: "Regras e Simulador"
    timeout: 5000

# ------------------------------------------------------------------------------
# PARTE 5: PUBLICAÇÃO E VERSIONAMENTO DE NOVA REGRA (v2)
# ------------------------------------------------------------------------------
- scroll

# Edita o nome da regra
- tapOn:
    below: "Nome ou Descrição da Regra"
- eraseText: 50
- inputText: "Fidelidade R$ 5"
- hideKeyboard

# Edita a base monetária para 5
- tapOn:
    below: "A cada R$ (Base)"
- eraseText: 10
- inputText: "5"
- hideKeyboard

- scroll

# Toca no botão de Publicar Nova Regra
- tapOn: "Publicar Nova Regra (v2)"

- extendedWaitUntil:
    visible: "OK"
    timeout: 10000

- tapOn: "OK"

# ------------------------------------------------------------------------------
# PARTE 6: INVALIDAÇÃO DE CACHE E ATUALIZAÇÃO INSTANTÂNEA DA UI
# ------------------------------------------------------------------------------
- scrollUntilVisible:
    element: "v2"
    direction: UP
    timeout: 10000

- assertVisible: ".*Fidelidade R\\$ 5.*"
- assertVisible: "v2"

# Valida no Histórico a existência de v2 (Ativa) e v1 (Inativa)
- tapOn: "Histórico"
- extendedWaitUntil:
    visible: "Versão 2"
    timeout: 5000

- assertVisible: "Versão 1"
- assertVisible: "Inativa"

# Retorna para a tela de regras
- tapOn: "Voltar"

- extendedWaitUntil:
    visible: "Regras e Simulador"
    timeout: 5000

# ------------------------------------------------------------------------------
# PARTE 7: LOGOUT PARA HIGIENIZAÇÃO DO ESTADO
# ------------------------------------------------------------------------------
- tapOn: "Perfil Loja"

- extendedWaitUntil:
    visible: "Encerrar Sessão"
    timeout: 10000

- tapOn: "Encerrar Sessão"

- extendedWaitUntil:
    visible: "Sair"
    timeout: 5000

- tapOn: "Sair"

- extendedWaitUntil:
    visible: "Bem-vindo ao CashMe"
    timeout: 10000
