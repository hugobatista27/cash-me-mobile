appId: host.exp.exponent
---
# ==============================================================================
# Suíte de Testes E2E Maestro - TASK-06: Interface do Lojista (Regras & Simulador)
# 1. Cadastro de Lojista novo (garante v1 inicial e estado limpo)
# 2. Validação da Regra Ativa Vigente (Card com resumo humano)
# 3. Simulação em Tempo Real com Debounce
# 4. Navegação e Auditoria de Histórico de Regras (RN04)
# 5. Publicação e Versionamento de Nova Regra (v2)
# 6. Invalidação de Cache e Atualização Instantânea da UI
# 7. Logout para Higienização do Estado
# ==============================================================================

# 0. Normaliza estado inicial
- runFlow:
    when:
      visible: "Histórico de Regras"
    commands:
      - tapOn: "Voltar"

- runFlow:
    when:
      visible: "← Voltar para login"
    commands:
      - tapOn: "← Voltar para login"

- runFlow:
    when:
      visible: "Área do Consumidor"
    commands:
      - tapOn: "Perfil"
      - extendedWaitUntil:
          visible: "Encerrar Sessão"
          timeout: 10000
      - tapOn: "Encerrar Sessão"
      - extendedWaitUntil:
          visible: "Sair"
          timeout: 5000
      - tapOn: "Sair"

- runFlow:
    when:
      visible: "Painel do Estabelecimento"
    commands:
      - tapOn: "Perfil Loja"
      - extendedWaitUntil:
          visible: "Encerrar Sessão"
          timeout: 10000
      - tapOn: "Encerrar Sessão"
      - extendedWaitUntil:
          visible: "Sair"
          timeout: 5000
      - tapOn: "Sair"

- extendedWaitUntil:
    visible: "Bem-vindo ao CashMe"
    timeout: 15000

# ------------------------------------------------------------------------------
# PARTE 1: ONBOARDING DE LOJISTA NOVO (GARANTE REGRA v1 INICIAL)
# ------------------------------------------------------------------------------
- evalScript: ${var ts=Date.now(); function gCnpj(seed){var x=seed%1000000007, b=[]; for(var i=0;i<8;i++){x=(x*1103515245+12345)%2147483647; b.push(x%10);} b.push(0,0,0,1); var w1=[5,4,3,2,9,8,7,6,5,4,3,2], s1=0; for(var j=0;j<12;j++)s1+=b[j]*w1[j]; var r1=s1%11; b.push(r1<2?0:11-r1); var w2=[6,5,4,3,2,9,8,7,6,5,4,3,2], s2=0; for(var k=0;k<13;k++)s2+=b[k]*w2[k]; var r2=s2%11; b.push(r2<2?0:11-r2); return b.join('');} output.cnpj=gCnpj(ts+3571); output.email='rules.m.'+ts+'@cashme.test';}

- tapOn: "Cadastrar Lojista"
- extendedWaitUntil:
    visible: "Onboarding do Comércio"
    timeout: 5000

- tapOn: "Ex: Carlos Eduardo"
- inputText: "Gestor Regras"
- hideKeyboard

- tapOn: "contato@minhaloja.com"
- inputText: ${output.email}
- hideKeyboard

- scrollUntilVisible:
    element: "Confirmar Senha"
    direction: DOWN
    timeout: 10000

- tapOn: "Mínimo 8 caracteres"
- inputText: "password123"
- hideKeyboard

- tapOn: "Repita sua senha"
- inputText: "password123"
- hideKeyboard

- scrollUntilVisible:
    element: "CNPJ"
    direction: DOWN
    timeout: 10000

- tapOn: "00.000.000/0000-00"
- inputText: ${output.cnpj}
- hideKeyboard

- tapOn: "Ex: Comercial de Alimentos Ltda"
- inputText: "Mercado Regras Ltda"
- hideKeyboard

- tapOn: "Ex: Supermercado Central"
- inputText: "Mercado Regras"
- hideKeyboard

- tapOn: "(00) 0000-0000"
- inputText: "4833334444"
- hideKeyboard

- scrollUntilVisible:
    element: "CEP"
    direction: DOWN
    timeout: 10000

- tapOn: "00000-000"
- inputText: "88010000"
- hideKeyboard

- tapOn: "Ex: Av. Brasil"
- inputText: "Rua Felipe Schmidt"
- hideKeyboard

- tapOn: "123"
- inputText: "100"
- hideKeyboard

- scrollUntilVisible:
    element: "Cadastrar Comércio"
    direction: DOWN
    speed: 60
    visibilityPercentage: 50
    timeout: 10000

- tapOn: "Centro"
- inputText: "Centro"
- hideKeyboard

- tapOn: "São Paulo"
- inputText: "Florianópolis"
- hideKeyboard

- tapOn: "SP"
- inputText: "SC"
- hideKeyboard

- scrollUntilVisible:
    element: "Cadastrar Comércio"
    direction: DOWN
    speed: 60
    visibilityPercentage: 50
    timeout: 10000

- tapOn: "Cadastrar Comércio"

- extendedWaitUntil:
    visible: "Painel do Estabelecimento"
    timeout: 15000

# ------------------------------------------------------------------------------
# PARTE 2: NAVEGAÇÃO PARA A TELA DE REGRAS E VALIDAÇÃO DA REGRA ATIVA
# ------------------------------------------------------------------------------
- tapOn: "Regras"

- extendedWaitUntil:
    visible: "Regras e Simulador"
    timeout: 10000

- assertVisible: "Políticas de Fidelidade"
- assertVisible: "Regra Ativa Oficial"
- assertVisible: "v1"

# ------------------------------------------------------------------------------
# PARTE 3: SIMULADOR EM TEMPO REAL
# ------------------------------------------------------------------------------
- tapOn:
    below: "Valor da Compra (R$)"
- eraseText: 20
- inputText: "250.00"
- hideKeyboard

- extendedWaitUntil:
    visible: "250 pts"
    timeout: 5000

# ------------------------------------------------------------------------------
# PARTE 4: AUDITORIA DO HISTÓRICO DE REGRAS
# ------------------------------------------------------------------------------
- tapOn: "Histórico"
- extendedWaitUntil:
    visible: "Histórico de Regras"
    timeout: 5000

- assertVisible: "Auditoria e versionamento imutável (RN04)"
- assertVisible: "Versão 1"
- assertVisible: "Ativa"

- tapOn: "Voltar"
- extendedWaitUntil:
    visible: "Regras e Simulador"
    timeout: 5000

# ------------------------------------------------------------------------------
# PARTE 5: PUBLICAÇÃO E VERSIONAMENTO DE NOVA REGRA (v2)
# ------------------------------------------------------------------------------
- scrollUntilVisible:
    element: "Publicar Nova Regra (v2)"
    direction: DOWN
    speed: 60
    visibilityPercentage: 50
    timeout: 10000

- tapOn:
    below: "Nome ou Descrição da Regra"
- eraseText: 50
- inputText: "Fidelidade R$ 5"
- hideKeyboard

- tapOn:
    below: "A cada R$ (Base)"
- eraseText: 10
- inputText: "5"
- hideKeyboard

- scrollUntilVisible:
    element: "Publicar Nova Regra (v2)"
    direction: DOWN
    speed: 60
    visibilityPercentage: 50
    timeout: 10000

- tapOn: "Publicar Nova Regra (v2)"

- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"

# ------------------------------------------------------------------------------
# PARTE 6: INVALIDAÇÃO DE CACHE E ATUALIZAÇÃO INSTANTÂNEA DA UI
# ------------------------------------------------------------------------------
- scrollUntilVisible:
    element: "v2"
    direction: UP
    timeout: 10000

- assertVisible: ".*Fidelidade R\\$ 5.*"
- assertVisible: "v2"

- tapOn: "Histórico"
- extendedWaitUntil:
    visible: "Versão 2"
    timeout: 5000

- assertVisible: "Versão 1"
- assertVisible: "Inativa"

- tapOn: "Voltar"
- extendedWaitUntil:
    visible: "Regras e Simulador"
    timeout: 5000

# ------------------------------------------------------------------------------
# PARTE 7: LOGOUT PARA HIGIENIZAÇÃO DO ESTADO
# ------------------------------------------------------------------------------
- tapOn: "Perfil Loja"
- extendedWaitUntil:
    visible: "Encerrar Sessão"
    timeout: 10000
- tapOn: "Encerrar Sessão"
- extendedWaitUntil:
    visible: "Sair"
    timeout: 5000
- tapOn: "Sair"
- extendedWaitUntil:
    visible: "Bem-vindo ao CashMe"
    timeout: 10000
